name: Tests

on:
  push:
    branches:
      - main
      - master
      - 'claude/**'
  pull_request:

jobs:
  test:
    name: Jest
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Instalar dependencias
        run: npm install --no-audit --no-fund

      - name: Ejecutar tests
        run: npm test -- --ci
